<div class="flex flex-col gap-4">
  <h2 class="text-lg font-bold text-slate-800">Productos candy más vendidos</h2>

  @if (unidadesPorArticulo.value()?.length) {
    <p-chart-svg [height]="360" [animation]="{ duration: 500 }">
      <p-chart-bar
        [data]="unidadesPorArticulo.value()!"
        categoryYField="nombre"
        valueXField="unidades"
        name="Unidades vendidas"
        sort="value-desc"
        [borderRadius]="4"
      />
      <p-chart-data-labels display="value" />
      <p-chart-tooltip />
      <p-chart-hover />
      <p-chart-x-axis [tickFormat]="formatoEntero" />
      <p-chart-y-axis />
    </p-chart-svg>
  } @else if (!unidadesPorArticulo.isLoading()) {
    <p class="rounded-xl border border-slate-200 bg-white p-6 text-center text-sm text-slate-500">
      Todavía no se vendieron productos candy.
    </p>
  }
</div>
