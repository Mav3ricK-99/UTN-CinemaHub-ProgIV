<header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-3">
  <p class="text-sm font-semibold text-slate-500">Panel de administración</p>

  @if (usuario(); as usuarioActual) {
    <div class="flex items-center gap-3 text-sm font-medium text-slate-700">
      <span>{{ usuarioActual.nombre }}</span>
      <button
        type="button"
        class="cursor-pointer rounded-full focus-visible:outline-2 focus-visible:outline-indigo-600"
        aria-haspopup="true"
        [attr.aria-label]="'Menú de ' + usuarioActual.nombre"
        (click)="menuUsuario.toggle($event)"
      >
        <p-avatar [image]="avatarUrl()" size="normal" shape="circle" />
      </button>
      <p-menu #menuUsuario [model]="itemsMenuUsuario" [popup]="true" appendTo="body" />
    </div>
  }
</header>
