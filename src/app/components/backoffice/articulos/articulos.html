<div class="flex flex-col gap-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Artículos</h1>
      <p class="text-sm text-slate-500">Listado de artículos cargados. Los disponibles se destacan.</p>
    </div>
    <a
      routerLink="/backoffice/articulos/nuevo"
      class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-500"
    >
      Nuevo artículo
    </a>
  </div>

  <div class="overflow-hidden rounded-xl border border-slate-200 bg-white">
    <p-table
      [value]="articulos.value() ?? []"
      [loading]="articulos.isLoading()"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 20, 50]"
      sortMode="single"
      sortField="nombre"
      [sortOrder]="1"
      dataKey="id"
      styleClass="text-sm"
    >
      <ng-template #header>
        <tr class="bg-slate-50 text-xs font-semibold uppercase text-slate-500">
          <th pSortableColumn="nombre" class="px-4 py-3">
            Nombre
            <p-sortIcon field="nombre" />
          </th>
          <th pSortableColumn="categoria.nombre" class="px-4 py-3">
            Categoría
            <p-sortIcon field="categoria.nombre" />
          </th>
          <th pSortableColumn="precio" class="px-4 py-3">
            Precio
            <p-sortIcon field="precio" />
          </th>
        </tr>
      </ng-template>

      <ng-template #body let-articulo>
        <tr [class.bg-emerald-50]="articulo.disponible" [class.bg-slate-100]="!articulo.disponible">
          <td class="px-4 py-3 font-medium text-slate-800">{{ articulo.nombre }}</td>
          <td class="px-4 py-3">
            <div class="flex flex-wrap gap-1">
              <p-tag [value]="articulo.categoria.nombre" severity="secondary" />
            </div>
          </td>
          <td class="px-4 py-3 text-slate-600">{{ articulo.precio | currency: 'ARS' : 'symbol' : '1.0-0' }}</td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="3" class="px-4 py-6 text-center text-slate-500">No hay artículos cargados.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
