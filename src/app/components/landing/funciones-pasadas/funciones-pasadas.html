@if (funciones().length > 0) {
  <section class="px-6 pb-40 pt-16 sm:px-12 lg:px-20" aria-labelledby="titulo-funciones-pasadas">
    <h2 id="titulo-funciones-pasadas" class="mb-12 text-3xl font-extrabold tracking-tight sm:text-4xl">
      Ya se proyectaron
    </h2>

    <div class="flex items-start gap-4 sm:gap-6">
      @for (columna of columnas(); track $index) {
        <div class="flex min-w-0 flex-1 flex-col gap-8" [class]="columna.desfase">
          <div class="flex flex-col gap-8" [appParallax]="columna.velocidad">
            @for (funcion of columna.funciones; track funcion.id) {
              <article class="group">
                <div class="aspect-[3/4] overflow-hidden rounded-lg bg-neutral-900">
                  <img
                    class="h-full w-full object-cover transition-transform duration-700 ease-out group-hover:scale-105"
                    [src]="funcion.pelicula.imagenUrl"
                    [alt]="'Imagen de ' + funcion.pelicula.nombre"
                    loading="lazy"
                  />
                </div>
                <h3 class="mt-3 truncate text-base font-bold uppercase tracking-wide">
                  {{ funcion.pelicula.nombre }}
                </h3>
                <p class="text-sm text-neutral-400">{{ funcion.fechaInicio | date: 'd MMM y' }}</p>
              </article>
            }
          </div>
        </div>
      }
    </div>
  </section>
}
