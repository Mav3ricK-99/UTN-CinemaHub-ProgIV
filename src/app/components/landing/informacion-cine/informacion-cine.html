<section class="relative isolate overflow-hidden bg-neutral-900" aria-label="Información del cine">
  <img
    class="absolute inset-0 -z-10 h-full w-full scale-110 object-cover blur-sm brightness-50 grayscale"
    src="https://picsum.photos/seed/sala-de-cine/1920/600"
    alt=""
    aria-hidden="true"
    loading="lazy"
  />
  <div class="absolute inset-0 -z-10 bg-neutral-950/50"></div>

  <div
    class="mx-auto flex max-w-7xl flex-col gap-10 px-6 py-16 sm:px-12 md:flex-row md:items-center md:justify-between lg:px-20"
  >
    <div class="flex flex-col gap-4">
      <h2 class="text-4xl font-extrabold tracking-tight text-red-600 sm:text-5xl">{{ nombreCine }}</h2>
      <ul class="flex flex-col gap-1 text-neutral-200">
        @for (horario of horarios; track horario.dias) {
          <li>
            <span class="font-semibold">{{ horario.dias }}:</span> {{ horario.horas }}
          </li>
        }
      </ul>
      <p class="text-neutral-200">
        <span class="font-semibold">Teléfono: </span>
        <a class="hover:underline" [href]="'tel:' + telefono">{{ telefono }}</a>
      </p>
    </div>

    <div class="md:text-right" aria-live="off">
      <p class="text-sm font-semibold uppercase tracking-widest text-neutral-300">Vení a disfrutar de</p>
      <div class="mt-2 grid overflow-hidden text-4xl font-extrabold leading-tight sm:text-5xl">
        @for (servicio of servicios; track servicio; let indice = $index) {
          <span
            class="col-start-1 row-start-1 transition-all duration-700 ease-in-out"
            [class]="clasesServicio(indice)"
            [attr.aria-hidden]="indice !== servicioActual()"
          >
            {{ servicio }}
          </span>
        }
      </div>
    </div>
  </div>
</section>
