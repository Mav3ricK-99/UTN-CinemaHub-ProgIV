<main class="min-h-screen bg-neutral-950 text-white">
  @if (funcionesProximas.isLoading()) {
    <div class="h-[85vh] min-h-[520px] animate-pulse bg-neutral-900"></div>
  } @else if (funcionesProximas.error()) {
    <p class="px-6 py-24 text-center text-neutral-400">No se pudo cargar la cartelera.</p>
  } @else {
    @let funciones = funcionesProximas.value() ?? [];
    @if (funciones.length > 0) {
      <app-cartelera-slider [funciones]="funciones" />
    } @else {
      <p class="px-6 py-24 text-center text-neutral-400">No hay funciones próximas.</p>
    }
  }

  <app-informacion-cine />

  @if (!funcionesPasadas.error()) {
    <app-funciones-pasadas [funciones]="funcionesPasadas.value() ?? []" />
  }
</main>
